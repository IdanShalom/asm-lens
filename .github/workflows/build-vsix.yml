name: Build VSIX

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Compilers on this runner (tests skip the missing ones)
        shell: bash
        run: |
          for c in g++ clang++ gcc clang c++filt python3 python rustc go swiftc zig gfortran; do
            printf '%-9s ' "$c"; { $c --version 2>/dev/null || $c version 2>/dev/null || echo '-'; } | head -1
          done

      - name: Test
        run: npm test

  e2e:
    name: In a real VS Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run the extension in VS Code
        run: |
          npm install --no-save --no-audit --no-fund @vscode/test-electron
          xvfb-run -a node test/e2e/run.js

  package:
    needs: [test, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Optional repository secret (Settings -> Secrets and variables -> Actions): publishes to Open VSX too.
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Package VSIX
        run: |
          VERSION=$(node -p "require('./package.json').version")
          npx --yes @vscode/vsce@4 package --out "asm-lens-$VERSION.vsix"
          npx --yes @vscode/vsce@4 ls

      - uses: actions/upload-artifact@v4
        with:
          name: asm-lens-vsix
          path: asm-lens-*.vsix

      - name: Check that the tag matches package.json (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node -e "
            const v = 'v' + require('./package.json').version;
            if (v !== process.env.GITHUB_REF_NAME) { console.error('Tag ' + process.env.GITHUB_REF_NAME + ' does not match ' + v + ' in package.json'); process.exit(1); }
          "

      - name: Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" asm-lens-*.vsix --title "Asm Lens $GITHUB_REF_NAME" --notes "See CHANGELOG.md."

      - name: Publish to Open VSX (tags v*, with secret OVSX_PAT)
        if: startsWith(github.ref, 'refs/tags/v') && env.OVSX_PAT != ''
        run: npx --yes ovsx@0 publish asm-lens-*.vsix -p "$OVSX_PAT"

  # Trusted Publishing: GitHub proves who is publishing, so no token is stored. Needs a policy for this
  # repository and this workflow file on the publisher's Trusted Publishing page.
  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/download-artifact@v4
        with:
          name: asm-lens-vsix

      - name: Publish to the Visual Studio Marketplace
        run: npx --yes @vscode/vsce@4 publish --oidc --packagePath asm-lens-*.vsix
