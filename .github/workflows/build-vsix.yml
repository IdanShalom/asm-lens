name: Build VSIX

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Compilers on this runner (tests skip the missing ones)
        shell: bash
        run: |
          for c in g++ clang++ gcc clang c++filt python3 python rustc go swiftc zig gfortran; do
            printf '%-9s ' "$c"; { $c --version 2>/dev/null || $c version 2>/dev/null || echo '-'; } | head -1
          done

      - name: Test
        run: npm test

  package:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Repository secrets (Settings -> Secrets and variables -> Actions). Without them nothing is published.
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Package VSIX
        run: |
          VERSION=$(node -p "require('./package.json').version")
          npx --yes @vscode/vsce@3 package --out "asm-lens-$VERSION.vsix"
          npx --yes @vscode/vsce@3 ls

      - uses: actions/upload-artifact@v4
        with:
          name: asm-lens-vsix
          path: asm-lens-*.vsix

      - name: Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" asm-lens-*.vsix --title "Asm Lens $GITHUB_REF_NAME" --notes "See CHANGELOG.md."

      - name: Check the tag and the publisher (tags v*)
        if: startsWith(github.ref, 'refs/tags/v') && (env.VSCE_PAT != '' || env.OVSX_PAT != '')
        run: |
          node -e "
            const p = require('./package.json');
            if ('v' + p.version !== process.env.GITHUB_REF_NAME) { console.error('Tag ' + process.env.GITHUB_REF_NAME + ' does not match version ' + p.version + ' in package.json'); process.exit(1); }
            if (p.publisher === 'local-dev') { console.error('Set \"publisher\" in package.json to your Marketplace publisher id'); process.exit(1); }
          "

      - name: Publish to the Visual Studio Marketplace (tags v*, with secret VSCE_PAT)
        if: startsWith(github.ref, 'refs/tags/v') && env.VSCE_PAT != ''
        run: npx --yes @vscode/vsce@3 publish --packagePath asm-lens-*.vsix

      - name: Publish to Open VSX (tags v*, with secret OVSX_PAT)
        if: startsWith(github.ref, 'refs/tags/v') && env.OVSX_PAT != ''
        run: npx --yes ovsx@0 publish asm-lens-*.vsix -p "$OVSX_PAT"
